<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة فريقنا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background: #ffffff;
            display: flex;
            justify-content: center;
        }

        .image-link {
            display: block;
            width: 100%;
            max-width: 600px;
            cursor: pointer;
        }

        .image-link img {
            display: block;
            width: 100%;
            height: auto;
            border: none;
        }
    </style>
</head>

<body>

       href="https://projctsappservice-tech.github.io/MinistryOfHeritageTouris/"

</html>
